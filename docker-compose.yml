services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: smartfactory-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

volumes:
  mqtt_data:
  mqtt_log:
