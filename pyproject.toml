[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfactory-ai"
version = "1.0.0"
description = "SmartFactory predictive maintenance AI module"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "joblib>=1.4",
    "PyYAML>=6.0",
    "paho-mqtt>=2.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
